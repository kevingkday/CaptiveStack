<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <circle cx="950" cy="180" r="350" fill="#1D4ED8" fill-opacity="0.25" filter="blur(90px)"/>
  <circle cx="200" cy="500" r="250" fill="#0284C7" fill-opacity="0.15" filter="blur(80px)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
  </g>

  <!-- Brand Pill -->
  <g transform="translate(100, 100)">
    <rect width="320" height="40" rx="20" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#3B82F6"/>
    <text x="42" y="25" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">MEMBER-OWNED GROUP CAPTIVES</text>
  </g>

  <!-- Title & Headline -->
  <text x="100" y="220" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Captive<tspan fill="#3B82F6">Stack</tspan>
  </text>
  <text x="100" y="295" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">
    Group Captive Insurance Formation &amp; Feasibility
  </text>

  <!-- Description -->
  <text x="100" y="360" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    Enabling groups and associations to evaluate feasibility, pool standby collateral,
  </text>
  <text x="100" y="392" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    and establish member-owned captive insurance companies.
  </text>

  <!-- Feature Tags -->
  <g transform="translate(100, 460)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Feasibility Modeling</text>

    <!-- Tag 2 -->
    <rect x="240" y="0" width="230" height="48" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="260" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Standby Capital Pools</text>

    <!-- Tag 3 -->
    <rect x="490" y="0" width="250" height="48" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="510" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Multi-Domicile Review</text>
  </g>

  <!-- Shield Badge Right Illustration -->
  <g transform="translate(860, 240)">
    <rect width="200" height="200" rx="40" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <path d="M100 35L145 60V105C145 136 126 164 100 173C74 164 55 136 55 105V60L100 35Z" fill="#2563EB"/>
    <path d="M100 55L132 72V104C132 126 118 147 100 154C82 147 68 126 68 104V72L100 55Z" fill="#3B82F6"/>
    <path d="M92 105L82 95L75 102L92 119L127 84L120 77L92 105Z" fill="#FFFFFF"/>
  </g>

  <!-- URL Footer -->
  <text x="100" y="570" fill="#64748B" font-family="system-ui, -apple-system, monospace" font-size="16">
    www.captivestack.com &bull; Founded by Kevin Day
  </text>
</svg>

