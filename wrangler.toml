name = "captivestack"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "captivestack-db"
database_id = "4f9c4fbc-cf82-4e11-ab2e-f1cdf915e052"
migrations_dir = "drizzle"

# Cloudflare R2 Bucket for Risk Documents & Loss Runs (PDF/XLS)
# Note: Enable R2 in the Cloudflare Dashboard to bind the live bucket
# [[r2_buckets]]
# binding = "DOCUMENTS_BUCKET"
# bucket_name = "captivestack-documents"

# Environment Variables
[vars]
ENVIRONMENT = "development"
PUBLIC_APP_NAME = "CaptiveStack"
PUBLIC_APP_DESCRIPTION = "Alternative Risk Transfer & Trade Association Group Captive Formation"
# Media CDN for static marketing assets (Zero local disk storage strategy)
PUBLIC_MEDIA_CDN_URL = "https://cdn.captivestack.com"
